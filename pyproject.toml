[project]
name = "ohsome"
version = "0.4.0"
description = "A Python client for the ohsome API"
authors = [
    { name = "HeiGIT ohsome team", email = "ohsome@heigit.org" },
    { name = "GIScience Research Group, Heidelberg University" }
]
repository = "https://github.com/GIScience/ohsome-py"
readme = 'README.md'
license = "GPL-3.0"

requires-python = ">=3.11, <4.0"

dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "pandas (>=2.3.3,<4.0.0)",
    "geopandas (>=1.1.1,<2.0.0)",
    "numpy (>=2.3.4,<3.0.0)",
    "urllib3 (>=2.5.0,<3.0.0)",
    "curlify2 (>=2.0.0,<3.0.0)",
]


[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "pandas-stubs (>=3.0.3.260530,<4.0.0.0)"
]
test = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-random-order (>=1.2.0,<2.0.0)",
    "pytest-recording (>=0.13.4,<0.14.0)",
    "responses (>=0.26.2,<0.27.0)"
]

[tool.dephell.main]
from = { format = "poetry", path = "pyproject.toml" }
to = { format = "setuppy", path = "setup.py" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
